
name: Build and release Windows IL2CPP

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag, for example v1.0.0 (leave empty for build only)"
        required: false
        type: string

      platform:
        description: "Which player to build (push always builds both)"
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - windows

permissions:
  contents: write

concurrency:
  group: unity-windows-il2cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Upstream publishes an "Unstable" APK next to the Windows zip; build one here too.
  # Android IL2CPP runs on the Linux android image (SDK/NDK already inside), so this
  # job is independent of the Windows container job and runs in parallel.
  android:
    name: Android IL2CPP
    # workflow_dispatch 里选了 windows 就跳过这一半；push 触发时 inputs 为空，照常构建。
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # game-ci reads the keystore payload and passwords from the ENVIRONMENT and drops
          # the decoded .keystore into the workspace. Passing them through `with:` only turns
          # them into -androidKeystorePass flags, so the file never lands and Unity fails with
          # "Can not sign the application / please provide passwords".
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: UmaViewer
          buildsPath: build
          # Only the file name belongs here; its contents come from the env above.
          androidKeystoreName: uma-release.keystore

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: UmaViewer-Android
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  build:
    name: Windows x64 IL2CPP
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      # windows-2022 自带 Docker 29.x，但 daemon 默认不启动；game-ci 的 Windows IL2CPP
      # 构建必须走 Windows 容器，起不来就会报 npipe docker_engine not found。
      - name: Start Docker engine
        shell: pwsh
        run: |
          try {
            Start-Service docker -ErrorAction Stop
            Write-Host "docker service started"
          } catch {
            Write-Host "Start-Service failed: $($_.Exception.Message)"
          }
          docker version
          docker info --format '{{.ServerVersion}}'

      - name: Verify Unity license secrets
        shell: pwsh
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          $missing = @()

          if ([string]::IsNullOrWhiteSpace($env:UNITY_LICENSE) -and
              [string]::IsNullOrWhiteSpace($env:UNITY_SERIAL)) {
            $missing += "UNITY_LICENSE or UNITY_SERIAL"
          }

          if ([string]::IsNullOrWhiteSpace($env:UNITY_EMAIL)) {
            $missing += "UNITY_EMAIL"
          }

          if ([string]::IsNullOrWhiteSpace($env:UNITY_PASSWORD)) {
            $missing += "UNITY_PASSWORD"
          }

          if ($missing.Count -gt 0) {
            throw "Missing repository secrets: $($missing -join ', '). See .github/UNITY_LICENSE_SETUP.md."
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify Unity project version
        shell: pwsh
        run: |
          $versionFile = "ProjectSettings/ProjectVersion.txt"

          if (!(Test-Path $versionFile)) {
            throw "Unity project version file not found: $versionFile"
          }

          $version = Get-Content $versionFile -Raw
          Write-Host $version

          if ($version -notmatch 'm_EditorVersion:\s*2022\.3\.62f3') {
            throw "Project Unity version does not match 2022.3.62f3. Update unityVersion in this workflow to match ProjectVersion.txt."
          }

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-StandaloneWindows64-IL2CPP-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-StandaloneWindows64-IL2CPP-

      - name: Build Windows player with IL2CPP
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.62f3
          targetPlatform: StandaloneWindows64
          buildName: UmaViewer
          buildsPath: build
          allowDirtyBuild: false

      - name: Verify build output
        shell: pwsh
        run: |
          $buildDir = "build/StandaloneWindows64"

          if (!(Test-Path $buildDir)) {
            throw "Build output directory not found: $buildDir"
          }

          $exe = Get-ChildItem $buildDir -Filter "*.exe" -File |
            Select-Object -First 1

          if ($null -eq $exe) {
            throw "No Windows executable was produced in $buildDir"
          }

          Write-Host "Build executable: $($exe.FullName)"
          Get-ChildItem $buildDir -Force |
            Select-Object Name, Length

      - name: Package Windows build
        shell: pwsh
        run: |
          $buildDir = "build/StandaloneWindows64"
          $zipPath = "UmaViewer-Windows-x64.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          # Unity always emits these two IL2CPP/Burst helper folders next to the player;
          # they are debug/backup only and must not ship in the artifact.
          Get-ChildItem -Path $buildDir -Directory -Force | Where-Object {
            $_.Name -like "*_BackUpThisFolder_ButDontShipItWithYourGame" -or
            $_.Name -like "*_BurstDebugInformation_DoNotShip"
          } | ForEach-Object {
            Write-Host "Excluding $($_.Name)"
            Remove-Item $_.FullName -Recurse -Force
          }

          Compress-Archive `
            -Path "$buildDir/*" `
            -DestinationPath $zipPath `
            -CompressionLevel Optimal

          if (!(Test-Path $zipPath)) {
            throw "ZIP packaging failed."
          }

          Write-Host "Package size: $((Get-Item $zipPath).Length) bytes"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          # Upload the unpacked player, not the zip: the artifact download is already a
          # zip, so uploading our zip nested it twice (one extraction yielded another zip).
          # The zip built above is only used for the GitHub Release asset.
          name: UmaViewer-Windows-x64
          path: build/StandaloneWindows64
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"

          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG `
              "UmaViewer-Windows-x64.zip" `
              --clobber

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload asset to existing release."
            }
          }
          else {
            gh release create $env:RELEASE_TAG `
              "UmaViewer-Windows-x64.zip#UmaViewer Windows x64 (IL2CPP)" `
              --target $env:TARGET_SHA `
              --title "UmaViewer $env:RELEASE_TAG" `
              --generate-notes

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release."
            }
          }
