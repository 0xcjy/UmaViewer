name: Cancel stale builds

# build.yml sets concurrency with cancel-in-progress, but that cancel is asynchronous: a run
# that is still queued keeps the group busy, and the newly queued run cannot execute its own
# "cancel the others" step because it has no runner yet. This workflow has no concurrency
# group of its own, so it starts immediately on every push and clears everything except the
# run for the commit being pushed.

on:
  push:
    branches:
      - master

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel unfinished builds of older commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'build.yml',
              per_page: 30
            });

            let cancelled = 0;

            for (const run of response.data.workflow_runs) {
              if (run.status === 'completed') continue;

              // Keep the run for the commit we just pushed: that is the one we want.
              if (run.head_sha === context.sha) {
                core.info(`Keeping run ${run.id} (${run.status}) for the current commit`);
                continue;
              }

              core.info(`Cancelling run ${run.id} (${run.status}) from ${run.head_sha}`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                cancelled++;
              } catch (error) {
                core.warning(`Could not cancel run ${run.id}: ${error.message}`);
              }
            }

            core.info(`Cancelled ${cancelled} stale run(s)`);
